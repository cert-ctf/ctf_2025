<body>

  <div class="flag-tiles" aria-hidden="true"></div>


  <!-- Auto-Play zufälliger Videos mit robuster Fehlerbehandlung -->
  <script>
    // 1) Video-IDs
    const GEMATIK_VIDEO_IDS = [
      "q1zKMu2xCUk","ORPEEZLxJVw","y3UPTI8YfPw","t3WwYzvaxx8","GMzHTq7E-P0",
      "Akw_Xocd-To","Q4_e9nQ30uU","uri-Rg9pNOA","YP9ttACkdQI","EqY6tF7UU-c",
      "7CHDeCeN1E4","imFLomexgbw","f5J4hfFRbHs","hUyCszjeLKo","eRtVQA_uo2I",
      "Wx8KrtsZRLo","kEDHtlc00UM","nKyc4XZ6KF8","45xeLk7qSpM","Tk7EUDivR9M",
      "ITHbOIRYi9Q","lrnlcOYym-M","hX612cdoWQ0","9EmcXtugh-I",
      // "ir2jSlPQvyM", // Hinweis: ggf. nicht einbettbar → auskommentiert
      "6fLWckVPz4U","IfEH_Y1caLQ","BL-V8RQbO5M","p7RYsVFMrCw","bsk7xptDwHM",
      "PUtThaDR1gU","2-QAJ-KSaVA","l7Sr-SKm1iU","QmSz8FrlzDU","Eecs7vnJeqY",
      "WYw38EmlzGw","7K5Ppp5X-No"
    ].filter(Boolean);

    // Optional: manuelle Blacklist für bekannte „Einbettung gesperrt“-Videos
    const EMBED_BLACKLIST = new Set([
      // "ir2jSlPQvyM"
    ]);

    // 2) Utils
    function pickRandom(excludeId = null) {
      const pool = GEMATIK_VIDEO_IDS.filter(id => id !== excludeId && !EMBED_BLACKLIST.has(id));
      if (!pool.length) return null;
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function loadNextRandom(currentId) {
      const nextId = pickRandom(currentId);
      if (!nextId) return false;
      try {
        player.loadVideoById({ videoId: nextId });
        currentIdRef = nextId;
        return true;
      } catch (e) {
        console.warn("loadVideoById Fehler, versuche nächstes:", e);
        return false;
      }
    }

    // 3) YouTube IFrame API laden
    (function loadYTAPI() {
      const s = document.createElement('script');
      s.src = "https://www.youtube.com/iframe_api";
      s.onerror = () => console.error("YouTube IFrame API konnte nicht geladen werden (CSP/Netzwerk?)");
      document.head.appendChild(s);
    })();

    let player = null;
    let currentIdRef = null;

    // 4) IFrame API Callback
    window.onYouTubeIframeAPIReady = function() {
      currentIdRef = pickRandom(null) || GEMATIK_VIDEO_IDS[0];

      player = new YT.Player('ytplayer', {
        videoId: currentIdRef,
        playerVars: {
          autoplay: 1,      // Autoplay einschalten
          mute: 1,          // wichtig für Browser-Policy
          rel: 0,
          modestbranding: 1,
          playsinline: 1
        },
        events: {
          onReady: function(e) {
            try { e.target.playVideo(); } catch {}
          },
          onStateChange: function(e) {
            // 0 = ENDED → nächstes zufälliges Video
            if (e.data === YT.PlayerState.ENDED) {
              const ok = loadNextRandom(currentIdRef);
              if (!ok) console.warn("Kein weiteres einbettbares Video gefunden.");
            }
          },
          onError: function(err) {
            // Typische Fehlercodes:
            // 2   = ungültiger Parameter (ID)
            // 5   = HTML5-Player-Fehler
            // 101 = Einbetten vom Uploader untersagt
            // 150 = Einbetten (rechtlich) untersagt – ähnlich zu 101
            const code = err?.data;
            console.warn("YouTube Player error:", code, "für ID:", currentIdRef);

            // Problematische ID in Blacklist aufnehmen (optional)
            if (code === 101 || code === 150) {
              EMBED_BLACKLIST.add(currentIdRef);
            }

            // Direkt zum nächsten zufälligen Video springen
            const ok = loadNextRandom(currentIdRef);
            if (!ok) {
              // Fallback: öffne den Link im neuen Tab, damit der Nutzer dennoch schauen kann
              const url = `https://www.youtube.com/watch?v=${currentIdRef}`;
              console.warn("Öffne stattdessen im neuen Tab:", url);
              try { window.open(url, '_blank', 'noopener'); } catch {}
            }
          }
        }
      });
    };
  </script>

  <script src="./js/background.js"></script>
</body>
</html>
