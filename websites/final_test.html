<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morphin Console – Eingabe (Centered Flag, New Colors)</title>
  <style>
    :root{
      --bg:#0a0f1c;
      --text:#e8ecff;
      --muted:#9fb0ff;
      --ok:#22d1a1;
      --err:#ff5a87;

      /* Neue Farbzuteilung */
      --erx:#9b59b6;   /* eRX lila */
      --epa:#2ecc71;   /* ePA grün */
      --tim:#e74c3c;   /* TIM rot */
      --kim:#f39c12;   /* KIM orange */

      --flag:#d7ffe8;
    }
    *{box-sizing:border-box}
    body{
      margin:0; padding:24px;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Ubuntu,Arial,sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #182246 0%, #0b1024 45%, #070b18 100%), var(--bg);
      color:var(--text);
    }

    .morph-console{
      max-width:820px; margin:0 auto;
      display:grid; gap:18px;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.12);
      border-radius:16px;
      padding:24px;
      box-shadow: 0 10px 28px rgba(0,0,0,.45), inset 0 0 32px rgba(255,255,255,.04);
      position:relative;
      overflow:hidden;
      min-height: 620px; /* etwas mehr Platz für Flag unter Schloss */
    }

    .console-header{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
    }
    .console-title{
      margin:0; font-variation-settings:"wght" 750;
      letter-spacing:.02em; font-size:1.25rem;
      text-shadow: 0 2px 12px rgba(0,0,0,.35);
      display:flex; align-items:center; gap:10px;
    }
    .badge {
      display:inline-flex; align-items:center; gap:6px;
      font-weight:800; letter-spacing:.06em;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
      padding:6px 10px; border-radius:999px;
    }

    .ranger-grid{
      display:grid; grid-template-columns: repeat(2,minmax(0,1fr));
      gap:14px;
      transition: filter .28s ease, opacity .28s ease;
    }
    @media (max-width:700px){ .ranger-grid{ grid-template-columns:1fr; } }

    /* Fokus-Phase: Blur & Dim */
    .focus-blur .ranger-grid{
      filter: blur(6px) brightness(.85);
      opacity:.85;
    }

    .ranger-card{
      position:relative;
      border-radius:14px;
      padding:16px;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.12);
      box-shadow: inset 0 0 24px rgba(0,0,0,.25);
      overflow:hidden;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .ranger-card:hover{
      transform: translateY(-3px);
      box-shadow: 0 14px 28px rgba(0,0,0,.45), inset 0 0 24px rgba(255,255,255,.05);
      border-color: rgba(255,255,255,.18);
    }
    /* Hover aus bei Fokus auf Schloss */
    .focus-blur .ranger-card:hover{
      transform:none;
      box-shadow: inset 0 0 24px rgba(0,0,0,.25);
      border-color: rgba(255,255,255,.12);
    }

    .ranger-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
    .ranger-left{ display:flex; align-items:center; gap:10px; }
    .token{
      width:42px; height:42px; border-radius:8px;
      display:grid; place-items:center; font-size:15px; font-weight:900; color:#0b0f1f;
      background:#fff; box-shadow: 0 0 0 2px rgba(0,0,0,.2) inset;
      letter-spacing:.02em; text-transform:uppercase;
    }
    .ranger-name{ margin:0; font-size:1rem; font-weight:800; letter-spacing:.02em; }
    .status{ margin:0; font-size:.84rem; font-weight:800; letter-spacing:.02em; }
    .status.ok{ color: var(--ok); }
    .status.err{ color: var(--err); }
    .status.empty{ color: var(--muted); opacity:.85; }

    .io{ display:grid; grid-template-columns: 1fr auto; gap:10px; align-items:center; }
    .code{
      width:100%; padding:12px 14px; border-radius:10px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(8,12,30,.6);
      color:var(--text); outline:none;
      transition: box-shadow .15s ease, border-color .15s ease, background .15s ease;
      caret-color: currentColor;
    }
    .code:focus{
      border-color: rgba(120,180,255,.65);
      box-shadow: 0 0 0 3px rgba(120,180,255,.18);
      background: rgba(12,18,40,.75);
    }
    .morph-btn{
      padding:12px 14px; border-radius:10px; border:0; cursor:pointer;
      font-weight:900; letter-spacing:.06em;
      color:#0b0f1f; background:#fff;
      box-shadow: 0 6px 14px rgba(0,0,0,.35);
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    }
    .morph-btn:hover{ transform: translateY(-1px); }
    .morph-btn:active{ transform: translateY(0); filter: brightness(.95); }

    /* Token-Farben nach neuer Zuordnung */
    .erx   { --accent: var(--erx); }
    .epa   { --accent: var(--epa); }
    .kim   { --accent: var(--kim); }
    .tim   { --accent: var(--tim); }
    .erx .token{ background: var(--erx); }
    .epa .token{ background: var(--epa); }
    .kim .token{ background: var(--kim); }
    .tim .token{ background: var(--tim); }
    .ranger-card .ranger-name{ color: var(--accent); }

    .energy{
      height:8px; border-radius:999px; margin-top:10px;
      background: linear-gradient(90deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
      border:1px solid rgba(255,255,255,.12);
      overflow:hidden; visibility: hidden;
    }
    .energy.active{ visibility: visible; }
    .fill{
      height:100%; width:0%;
      background: linear-gradient(90deg, rgba(255,255,255,.0) 0%, var(--accent) 30%, #fff 100%);
      box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 60%, transparent);
      transition: width .35s ease;
    }

    .console-actions{
      display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:6px; min-height:48px;
    }
    .ghost{
      background: transparent; color:var(--text);
      border:1px solid rgba(255,255,255,.25); padding:10px 16px; border-radius:10px;
      cursor:pointer; transition: background .12s ease;
      font-weight:900; letter-spacing:.04em;
      height:48px;
    }
    .ghost:hover{ background: rgba(255,255,255,.06); }

    .pulse-ok{ box-shadow: 0 0 0 0 rgba(34,209,161,.5); animation:pulseOK .5s ease; }
    @keyframes pulseOK{ to{ box-shadow:0 0 0 16px rgba(34,209,161,0); } }
    .pulse-err{ box-shadow: 0 0 0 0 rgba(255,90,135,.5); animation:pulseERR .5s ease; }
    @keyframes pulseERR{ to{ box-shadow:0 0 0 16px rgba(255,90,135,0); } }

    .morph-console::after{
      content:""; position:absolute; inset:0;
      background: repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 2px, transparent 2px 6px);
      pointer-events:none; mix-blend-mode:soft-light;
    }

    /* Center lock */
    .center-lock{
      position:absolute; left:50%; top:40%; transform: translate(-50%,-50%) scale(0.9);
      width:240px; height:240px; border-radius:28px;
      background: rgba(0,0,0,0.35);
      border:2px solid rgba(255,255,255,0.15);
      display:none;
      place-items:center;
      z-index: 5;
      transition: transform .28s ease, box-shadow .28s ease, border-color .28s ease, background .28s ease, opacity .28s ease;
    }
    .center-lock.visible{
      display:grid;
      animation: lockPop .26s ease forwards;
    }
    @keyframes lockPop{
      from{ opacity:0; transform: translate(-50%,-50%) scale(0.8); }
      to  { opacity:1; transform: translate(-50%,-50%) scale(1); }
    }

    /* Icon */
    .lock-icon{
      position:absolute; inset:0; display:grid; place-items:center; z-index:3; pointer-events:none;
    }
    .lock-icon .glyph{
      font-size:84px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.45));
      transition: transform .25s ease;
    }
    .center-lock.closed .lock-icon .glyph{ transform: scale(1.02); }

    /* Glow + Zoom Loops fürs Schloss (beibehalten) */
    @keyframes glowPulseLoop{
      0%  { box-shadow: 0 0 20px 7px rgba(34,209,161,.24); }
      50% { box-shadow: 0 0 38px 15px rgba(34,209,161,.36); }
      100%{ box-shadow: 0 0 20px 7px rgba(34,209,161,.24); }
    }
    @keyframes zoomPulseLoop{
      0%   { transform: translate(-50%,-50%) scale(1.04); }
      50%  { transform: translate(-50%,-50%) scale(1.07); }
      100% { transform: translate(-50%,-50%) scale(1.04); }
    }

    .center-lock.closed{
      background: rgba(60,200,160,.15);
      border-color: rgba(60,200,160,.7);
      box-shadow: 0 0 30px rgba(60,200,160,.35), inset 0 0 22px rgba(60,200,160,.25);
      transform: translate(-50%,-50%) scale(1.04);
      animation: zoomPulseLoop 1800ms ease-in-out infinite;
    }
    .center-glow{
      position:absolute; inset:-16px; border-radius:30px;
      box-shadow: 0 0 20px 7px rgba(34,209,161,.24);
      pointer-events:none; opacity:0; z-index:2;
    }
    .center-lock.closed .center-glow{
      opacity:1; animation: glowPulseLoop 1800ms ease-in-out infinite;
    }

    /* SVG layer */
    .lock-svg{ width:180px; height:180px; z-index:1; opacity:0.9; }
    .wedge{ opacity:0; transition: opacity .18s ease; }
    .wedge.visible{ opacity:.32; }
    /* Neue Wedge-Farben */
    .wedge.erx{ fill: var(--erx); }
    .wedge.epa{ fill: var(--epa); }
    .wedge.kim{ fill: var(--kim); }
    .wedge.tim{ fill: var(--tim); }

    .charge-glow{
      position:absolute; inset:8px; border-radius:22px; pointer-events:none; z-index:1; opacity:0;
      background: conic-gradient(from 0deg,
        color-mix(in srgb, var(--erx) 40%, transparent) 0 90deg,
        color-mix(in srgb, var(--epa) 40%, transparent) 90deg 180deg,
        color-mix(in srgb, var(--kim) 40%, transparent) 180deg 270deg,
        color-mix(in srgb, var(--tim) 40%, transparent) 270deg 360deg
      );
      filter: blur(6px);
    }
    .center-lock.visible .charge-glow{ opacity:.9; animation: glowIntro 1200ms ease forwards; }
    @keyframes glowIntro{
      0%{ opacity:0; filter: blur(10px); transform: scale(.96); }
      70%{ opacity:.95; filter: blur(6px); transform: scale(1.02); }
      100%{ opacity:.85; filter: blur(6px); transform: scale(1); }
    }
    .center-lock.closed .charge-glow{ opacity:.25; }

    /* FLAG BOX – zentriert unter dem Schloss, ohne Glow/Zoom */
    .flag-wrapper{
      position:absolute; left:50%; top: calc(40% + 160px); /* Schloss-Mitte + Abstand */
      transform: translate(-50%, 0);
      z-index: 4;
      display:none; /* verborgen bis Close */
    }
/* FLAG BOX (ersetzt den Check-Button) */
.flag-box{
  display:none;
  align-items:center; gap:10px; flex-wrap:wrap;
  padding:10px 14px; border-radius:12px;
  border:1px solid rgba(34,209,161,.55);
  background: rgba(34,209,161,.10);
  color: var(--flag);
  position:relative;
  min-height:48px;
}
.flag-box .label{
  font-weight:800; letter-spacing:.03em;
  color:var(--flag);
}
.flag-box .value{
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size:.95rem; padding:6px 10px; border-radius:8px;
  background: rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.15);
  color: var(--text);
  user-select: all;
}
.copy-btn{
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 10px; border-radius:10px; border:0; cursor:pointer;
  background: rgba(255,255,255,.88); color:#0b0f1f; font-weight:800;
  transition: transform .1s ease, filter .12s ease;
  height:38px;
}
.copy-btn:hover{ transform: translateY(-1px); }
.copy-btn:active{ transform: translateY(0); filter: brightness(.95); }
.copy-btn .icon{
  width:16px; height:16px; display:inline-block;
  background: currentColor; mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="white" d="M16 1H4a2 2 0 0 0-2 2v12h2V3h12V1Zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm0 16H8V7h11v14Z"/></svg>') no-repeat center / contain;
}

/* Flag-Glow: gleicher Puls wie Schloss – nur Container/Hook, Timing steuerst du via JS (class="glow") */
.flag-box::after{
  content:""; position:absolute; inset:-8px; border-radius:14px; pointer-events:none;
  box-shadow: 0 0 0 0 rgba(34,209,161,0);
  opacity:0;
}
.flag-box.glow{
  /* Einmal anblenden + Puls-Loop analog – die eigentliche Animation definierst du bereits global (centerGlow/glowPulseLoop) */
  animation: none;
}
.flag-box.glow::after{
  opacity:1;
  /* In deinem bestehenden Code fügst du hier die gleichen Animationsnamen/-zeiten ein,
     falls du sie für die Flag nutzen willst. Wenn nicht: leer lassen = kein Glow. */
}

  </style>
</head>
<body>
  <section class="morph-console" id="console">
    <div class="console-header">
      <h3 class="console-title">Morphin Console <span class="badge">IT’S MORPHIN TIME!</span></h3>
    </div>

    <div class="ranger-grid">
      <div class="ranger-card erx" data-id="erx">
        <div class="ranger-head">
          <div class="ranger-left">
            <div class="token">eRX</div>
            <h4 class="ranger-name">eRX Zord</h4>
          </div>
          <small class="status empty">—</small>
        </div>
        <div class="io">
          <input class="code" type="password" placeholder="eRX Code (1234)" autocomplete="off">
          <button class="morph-btn">MORPH</button>
        </div>
        <div class="energy"><div class="fill"></div></div>
      </div>

      <div class="ranger-card epa" data-id="epa">
        <div class="ranger-head">
          <div class="ranger-left">
            <div class="token">ePA</div>
            <h4 class="ranger-name">ePA Zord</h4>
          </div>
          <small class="status empty">—</small>
        </div>
        <div class="io">
          <input class="code" type="password" placeholder="ePA Code (1234)" autocomplete="off">
          <button class="morph-btn">MORPH</button>
        </div>
        <div class="energy"><div class="fill"></div></div>
      </div>

      <div class="ranger-card kim" data-id="kim">
        <div class="ranger-head">
          <div class="ranger-left">
            <div class="token">KIM</div>
            <h4 class="ranger-name">KIM Zord</h4>
          </div>
          <small class="status empty">—</small>
        </div>
        <div class="io">
          <input class="code" type="password" placeholder="KIM Code (1234)" autocomplete="off">
          <button class="morph-btn">MORPH</button>
        </div>
        <div class="energy"><div class="fill"></div></div>
      </div>

      <div class="ranger-card tim" data-id="tim">
        <div class="ranger-head">
          <div class="ranger-left">
            <div class="token">TIM</div>
            <h4 class="ranger-name">TIM Zord</h4>
          </div>
          <small class="status empty">—</small>
        </div>
        <div class="io">
          <input class="code" type="password" placeholder="TIM Code (1234)" autocomplete="off">
          <button class="morph-btn">MORPH</button>
        </div>
        <div class="energy"><div class="fill"></div></div>
      </div>
    </div>

    <div class="console-actions" id="actionsRow">
        <button class="ghost" id="checkBtn">MEGAZORD PRÜFEN</button>
        <!-- Flag Box wird dynamisch eingeblendet -->
        <div class="flag-box" id="flagBox" aria-live="polite">
            <span class="label">Flag:</span>
            <span class="value" id="flagValue">ti_ctf{storyline_completed}</span>
            <button class="copy-btn" id="copyBtn" type="button" title="In die Zwischenablage kopieren">
            <span class="icon" aria-hidden="true"></span>
            Copy
            </button>
        </div>
    </div>

    <!-- Center lock -->
    <div class="center-lock" id="centerLock" aria-live="polite">
      <div class="charge-glow"></div>

      <!-- SVG donut with wedges -->
      <svg class="lock-svg" viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="88" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="2"></circle>
        <path class="wedge erx" id="w-erx" d="" />
        <path class="wedge epa" id="w-epa" d="" />
        <path class="wedge kim" id="w-kim" d="" />
        <path class="wedge tim" id="w-tim" d="" />
        <circle cx="100" cy="100" r="28" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.08)" stroke-width="2"></circle>
      </svg>

      <div class="lock-icon"><div class="glyph" id="lockGlyph" aria-hidden="true">🔓</div></div>
      <div class="center-glow"></div>
    </div>

    <!-- Audio element -->
    <audio id="morphAudio" preload="auto">
      <source src="power ranger.mp3" type="audio/mpeg">
    </audio>
  </section>

  <script>
    // Alle Codes = 1234
    const CODES = { erx:'1234', epa:'1234', kim:'1234', tim:'1234' };

    const consoleEl   = document.getElementById('console');
    const cards       = [...consoleEl.querySelectorAll('.ranger-card')];
    const checkBtn    = document.getElementById('checkBtn');
    const flagWrapper = document.getElementById('flagWrapper');
    const flagBox     = document.getElementById('flagBox');
    const flagValue   = document.getElementById('flagValue');
    const copyBtn     = document.getElementById('copyBtn');

    const centerLock  = document.getElementById('centerLock');
    const lockGlyph   = document.getElementById('lockGlyph');
    const morphAudio  = document.getElementById('morphAudio');

    function setEnergy(card, pct){
      const energy = card.querySelector('.energy');
      const fill   = card.querySelector('.fill');
      if (pct > 0) energy.classList.add('active'); else energy.classList.remove('active');
      fill.style.width = Math.max(0, Math.min(100, pct)) + '%';
    }

    function setStatusLabel(card, state){
      const label = card.querySelector('.status');
      label.classList.remove('ok','err','empty');
      if (state === 'ok'){ label.textContent = 'Korrekt'; label.classList.add('ok'); }
      else if (state === 'err'){ label.textContent = 'Falsch'; label.classList.add('err'); }
      else { label.textContent = '—'; label.classList.add('empty'); }
    }

    // Morph-Button Logik
    cards.forEach(card=>{
      const id    = card.dataset.id;
      const input = card.querySelector('.code');
      const btn   = card.querySelector('.morph-btn');

      input.addEventListener('input', ()=>{
        setEnergy(card, 0);
        setStatusLabel(card, 'empty');
        card.dataset.active = '0';

        // UI zurücknehmen, falls Sequenz lief
        consoleEl.classList.remove('focus-blur');
        centerLock.classList.remove('visible','closed');
        lockGlyph.textContent = '🔓';
        Object.values(wedges).forEach(w => w.classList.remove('visible'));

        // Flag ausblenden, Button zurück
        flagWrapper.style.display = 'none';
        checkBtn.style.display = 'inline-block';
      });

      function morph(){
        const val = (input.value || '').trim();
        const ok  = val === (CODES[id]||'');

        btn.classList.remove('pulse-ok','pulse-err'); void btn.offsetWidth;
        btn.classList.add(ok ? 'pulse-ok' : 'pulse-err');

        if(ok){
          setEnergy(card, 100);
          setStatusLabel(card, 'ok');
          card.dataset.active = '1';
        }else{
          setEnergy(card, 0);
          setStatusLabel(card, 'err');
          card.dataset.active = '0';
        }
      }

      btn.addEventListener('click', morph);
      input.addEventListener('keydown', e=>{
        if(e.key === 'Enter'){ e.preventDefault(); morph(); }
      });
    });

    function allOk(){ return cards.every(c => c.dataset.active === '1'); }

    // SVG Helpers
    function polar(cx, cy, r, ang){ return { x: cx + r*Math.cos(ang), y: cy + r*Math.sin(ang) }; }
    function wedgePath(cx, cy, r, startDeg, endDeg){
      const a0 = (startDeg-90) * Math.PI/180; // 0° oben
      const a1 = (endDeg-90)   * Math.PI/180;
      const p0 = polar(cx, cy, r, a0);
      const p1 = polar(cx, cy, r, a1);
      const largeArc = (endDeg - startDeg) > 180 ? 1 : 0;
      return `M ${cx} ${cy} L ${p0.x} ${p0.y} A ${r} ${r} 0 ${largeArc} 1 ${p1.x} ${p1.y} Z`;
    }

    const wedges = {
      erx: document.getElementById('w-erx'), // 0-90
      epa: document.getElementById('w-epa'), // 90-180
      kim: document.getElementById('w-kim'), // 180-270
      tim: document.getElementById('w-tim'), // 270-360
    };

    function buildWedges(){
      const cx=100, cy=100, r=80;
      wedges.erx.setAttribute('d', wedgePath(cx,cy,r,   0,  90));
      wedges.epa.setAttribute('d', wedgePath(cx,cy,r,  90, 180));
      wedges.kim.setAttribute('d', wedgePath(cx,cy,r, 180, 270));
      wedges.tim.setAttribute('d', wedgePath(cx,cy,r, 270, 360));
    }
    buildWedges();

    function runSequence(){
      // Fokus auf Schloss
      consoleEl.classList.add('focus-blur');
      centerLock.classList.add('visible');

      const order = [wedges.erx, wedges.epa, wedges.kim, wedges.tim];
      order.forEach((w,i)=> setTimeout(()=> w.classList.add('visible'), i*160));

      const totalDelay = 160*order.length + 300;
      setTimeout(()=>{
        centerLock.classList.add('closed');
        lockGlyph.textContent = '🔒';
        // Sound abspielen
        try { morphAudio.currentTime = 0; morphAudio.play().catch(()=>{}); } catch(e){}

        // Button aus, Flag zentriert unter Schloss anzeigen
        checkBtn.style.display = 'none';
        flagBox.style.display = 'inline-flex';
       
      }, totalDelay);
    }

    checkBtn.addEventListener('click', ()=>{
      if(allOk()){
        checkBtn.classList.remove('pulse-ok'); void checkBtn.offsetWidth;
        checkBtn.classList.add('pulse-ok');
        runSequence();
      }else{
        checkBtn.classList.remove('pulse-err'); void checkBtn.offsetWidth;
        checkBtn.classList.add('pulse-err');
        // UI nicht festhängen lassen
        consoleEl.classList.remove('focus-blur');
        centerLock.classList.remove('visible','closed');
        lockGlyph.textContent = '🔓';
        Object.values(wedges).forEach(w => w.classList.remove('visible'));
        flagWrapper.style.display = 'none';
        checkBtn.style.display = 'inline-block';
      }
    });

    // Copy to clipboard
    copyBtn.addEventListener('click', async ()=>{
      const text = flagValue.textContent.trim();
      try{
        await navigator.clipboard.writeText(text);
        copyBtn.textContent = 'Copied';
        setTimeout(()=>{ copyBtn.innerHTML = '<span class="icon" aria-hidden="true"></span>Copy'; }, 1200);
      }catch(e){
        const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
        ta.select(); try{ document.execCommand('copy'); }catch(_){}
        ta.remove();
        copyBtn.textContent = 'Copied';
        setTimeout(()=>{ copyBtn.innerHTML = '<span class="icon" aria-hidden="true"></span>Copy'; }, 1200);
      }
    });
  </script>
</body>
</html>
